<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clasificador de tickets</title><style>body{font:16px system-ui;background:#f3f6fa;color:#193047;margin:0}main{max-width:720px;margin:50px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 4px 24px #ccd5dd}label{display:block;margin:20px 0 6px;font-weight:600}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bac8d4;border-radius:8px}button{background:#137b87;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;margin-top:16px}pre{white-space:pre-wrap;background:#edf5f7;padding:16px;border-radius:8px}</style></head><body><main><h1>Clasificación inteligente de tickets</h1><p>Fase II · Sistema de apoyo a la asignación de solicitudes</p><form id="form"><label for="subject">Asunto</label><input id="subject" maxlength="500"><label for="body">Descripción del problema</label><textarea id="body" rows="6" required maxlength="10000"></textarea><button>Clasificar solicitud</button></form><h2>Resultado</h2><pre id="result" aria-live="polite">Introduce una solicitud para comenzar.</pre></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const result=document.getElementById('result');result.textContent='Procesando...';try{const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:document.getElementById('subject').value,body:document.getElementById('body').value})});const data=await r.json();if(!r.ok)throw Error(JSON.stringify(data));result.textContent=`Cola: ${data.queue}\nConfianza: ${(data.confidence*100).toFixed(2)}%\nRevisión humana: ${data.requires_human_review?'Sí':'No'}`;}catch(err){result.textContent='Error: '+err.message}})</script></body></html>
